name: Snapshot promo pages

# Manual helper: saves each bank's raw promo page so the parsers can be checked against real markup.
on: workflow_dispatch

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Download pages
        run: |
          mkdir pages
          UA="Mozilla/5.0 (compatible; KaskasPromoBot/1.0; +https://github.com/chairell/kaskas)"
          while read name url; do
            curl -sSL -m 30 -A "$UA" -o "pages/$name.html" -w "$name %{http_code} %{size_download}\n" "$url" || echo "$name failed"
          done <<'LIST'
          bpi https://www.bpi.com.ph/personal/rewards-and-promotions/promos.html
          bpi-cc https://www.bpi.com.ph/creditcards/promos
          rcbc https://rcbccredit.com/promos
          eastwest https://www.eastwestbanker.com/promos?page=0
          maya https://www.maya.ph/deals
          pnb https://www.pnb.com.ph/index.php/pnb-credit-card-promos
          bdo https://www.deals.bdo.com.ph/home
          metrobank https://www.metrobank.com.ph/promos
          unionbank https://www.unionbankph.com/promos
          unionbank-cc https://www.unionbankph.com/cards/credit-card
          maribank https://www.maribank.ph/
          LIST
      - uses: actions/upload-artifact@v4
        with:
          name: pages
          path: pages
